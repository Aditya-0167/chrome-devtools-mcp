name: Verify PoC
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  run-poc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deps
        run: npm install
      - name: Build
        run: npm run build
      - name: Debug - list files
        run: |
          echo "--- source test file exists? ---"
          find tests -iname "*click_js_eval*"
          echo "--- compiled output ---"
          find build/tests -iname "*click*" 2>/dev/null || echo "build/tests/tools not found or empty of click files"
          ls build/tests/tools/ || echo "build/tests/tools directory does not exist"
      - name: Run PoC test
        run: node --test build/tests/tools/click_js_eval_bypass.test.js
